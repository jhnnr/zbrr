[package]
name = "zbrr"
version = "0.1.10"
edition = "2021"
description = "Automated Prowlarr-to-AnimeZ.to RSS/API release pipeline"
authors = ["AnimeZ Contributors"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
quick-xml = { version = "0.36", features = ["serialize"] }
rand = "0.8"
rayon = "1.10"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = [
    "cookies",
    "gzip",
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_bencode = "0.2"
serde_bytes = "0.11"
serde_json = "1.0"
sha1 = "0.10"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.12"
