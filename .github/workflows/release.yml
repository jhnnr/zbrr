name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: check
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="v$VERSION"
          echo "Detected Cargo.toml version: $VERSION ($TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force_release }}" = "true" ]; then
            echo "Force release requested."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping release creation."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected ($TAG does not exist yet). Proceeding with release!"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create GitHub Release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tag commit and create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Release ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-and-upload:
    name: Build & Upload (${{ matrix.target }})
    needs: [check-version, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_musl: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_musl: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_musl: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_musl: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_musl: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (musl)
        if: matrix.use_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux & macOS archive
        if: runner.os != 'Windows'
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="zbrr-${TAG}-${TARGET}"
          mkdir -p "dist/${ARCHIVE}"
          cp "target/${TARGET}/release/zbrr" "dist/${ARCHIVE}/"
          cp README.md .env.example "dist/${ARCHIVE}/" 2>/dev/null || true
          cd dist
          tar -czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = "${{ needs.check-version.outputs.tag }}"
          $TARGET = "${{ matrix.target }}"
          $ARCHIVE = "zbrr-${TAG}-${TARGET}"
          New-Item -ItemType Directory -Path "dist/$ARCHIVE" | Out-Null
          Copy-Item "target/$TARGET/release/zbrr.exe" "dist/$ARCHIVE/"
          Copy-Item "README.md", ".env.example" "dist/$ARCHIVE/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$ARCHIVE/*" -DestinationPath "dist/$ARCHIVE.zip"
          $hash = (Get-FileHash "dist/$ARCHIVE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE.zip" | Out-File -Encoding ascii "dist/$ARCHIVE.zip.sha256"

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
